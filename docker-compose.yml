## 8. Deployment, Containerization & Infrastructure

### 8.1 Docker & Docker Compose
The system is fully containerized. A multi-node distributed cluster is orchestrated via [`docker-compose.yml`](file:///c:/Users/manik/Downloads/project/docker-compose.yml):

```yaml
version: '3.8'

services:
  scheduler-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - WORKER_CONCURRENCY=4
      - DATABASE_PATH=/data/scheduler.db
      - START_EMBEDDED_WORKER=true
    volumes:
      - scheduler_data:/data

  scheduler-worker-2:
    build: .
    command: ["python", "run.py", "--worker-only", "--concurrency", "4"]
    environment:
      - DATABASE_PATH=/data/scheduler.db
      - WORKER_CONCURRENCY=4
    volumes:
      - scheduler_data:/data
    depends_on:
      - scheduler-api

volumes:
  scheduler_data:
```

### 8.2 Production Run Command
```bash
docker compose up --build
```

